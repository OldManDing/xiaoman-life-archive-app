<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/brand/nianlun-logo-64.png" />
    <link rel="apple-touch-icon" href="/brand/nianlun-logo-192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <style>
      html, body { margin: 0; min-height: 100%; background: #f9d3c0; }
      .nianlun-preboot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        align-content: center;
        gap: 14px;
        justify-items: center;
        background-color: #fbdfc9;
        background-image:
          radial-gradient(80% 42% at 82% 0%, rgba(255, 198, 142, 0.85) 0%, rgba(255, 198, 142, 0) 68%),
          radial-gradient(70% 40% at 16% 12%, rgba(255, 226, 194, 0.8) 0%, rgba(255, 226, 194, 0) 70%),
          linear-gradient(180deg, #ffe7cf 0%, #fcdcc7 55%, #f9d3c0 100%);
        transition: opacity 220ms ease-out;
      }
      .nianlun-preboot.is-leaving { opacity: 0; }
      .nianlun-preboot-dot {
        width: 9px;
        height: 9px;
        border-radius: 999px;
        background: #e9a05a;
        opacity: 0;
        animation: nlPrebootIn 320ms ease-out 40ms forwards;
      }
      .nianlun-preboot-word {
        font-family: "Songti SC", "Noto Serif SC", serif;
        font-size: 64px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: #5a3a22;
        opacity: 0;
        animation: nlPrebootIn 360ms ease-out 110ms forwards;
      }
      @keyframes nlPrebootIn {
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .nianlun-preboot-dot, .nianlun-preboot-word { animation: none; opacity: 1; transform: none; }
      }
    </style>
    <title>年轮</title>
  </head>
  <body>
    <main id="nianlun-preboot" class="nianlun-preboot" role="status" aria-label="正在启动年轮">
      <span aria-hidden="true" class="nianlun-preboot-dot"></span>
      <span aria-hidden="true" class="nianlun-preboot-word">年轮</span>
    </main>
    <div id="root"></div>
    <script>
      const nianlunRoot = document.getElementById('root');
      const nianlunPreboot = document.getElementById('nianlun-preboot');
      const nianlunObserver = new MutationObserver(() => {
        if (!nianlunRoot.firstElementChild) return;
        requestAnimationFrame(() => {
          nianlunObserver.disconnect();
          nianlunPreboot.classList.add('is-leaving');
          window.setTimeout(() => nianlunPreboot.remove(), 240);
        });
      });
      nianlunObserver.observe(nianlunRoot, { childList: true });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
